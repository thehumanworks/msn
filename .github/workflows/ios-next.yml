name: ios-next

on:
  pull_request:
    paths:
      - "apps/ios-next/**"
      - "apps/ios/src/**"
      - ".github/workflows/ios-next.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios-next/**"
      - "apps/ios/src/**"
      - ".github/workflows/ios-next.yml"

permissions:
  contents: read

jobs:
  client:
    name: iOS 26 client typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ios-next
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
