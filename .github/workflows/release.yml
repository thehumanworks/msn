name: release

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/release.yml"
  # Manual retry from the Actions tab. Use it when a push to main changed the
  # CLI but the release did not run, for example because GitHub could not
  # start any job. It releases the current head of main.
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        run: |
          set -euo pipefail
          git fetch --tags --force
          existing="$(git tag --points-at HEAD -l 'v[0-9]*' | head -n1 || true)"
          if [ -n "$existing" ]; then
            version="${existing#v}"
          else
            latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
            if [ -z "$latest" ]; then
              version="0.1.0"
            else
              ver="${latest#v}"
              major="${ver%%.*}"
              rest="${ver#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              patch="${patch%%-*}"
              version="${major}.${minor}.$((patch + 1))"
            fi
          fi
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: release-${{ matrix.target }}
      - name: Set package version
        working-directory: cli
        run: |
          set -euo pipefail
          python3 - <<PY
          from pathlib import Path
          import re
          ver = "${{ needs.version.outputs.version }}"
          toml = Path("Cargo.toml")
          text, n = re.subn(r'(?m)^version = "[^"]+"', f'version = "{ver}"', toml.read_text(), count=1)
          assert n == 1, "Cargo.toml version line"
          toml.write_text(text)
          lock = Path("Cargo.lock")
          text, n = re.subn(
              r'(name = "msn-cli"\nversion = ")[^"]+(")',
              rf"\g<1>{ver}\2",
              lock.read_text(),
              count=1,
          )
          assert n == 1, "Cargo.lock msn-cli version"
          lock.write_text(text)
          PY
      - name: Build
        working-directory: cli
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}"
          stage="msn-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/msn" "$stage/msn"
          tar -czf "${stage}.tar.gz" "$stage"
          if command -v sha256sum >/dev/null; then
            sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          else
            shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          fi
          mkdir -p "${{ github.workspace }}/dist"
          mv "${stage}.tar.gz" "${stage}.tar.gz.sha256" "${{ github.workspace }}/dist/"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
