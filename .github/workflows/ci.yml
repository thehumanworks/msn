name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      # The bundled runner test launches the MSN runtime, which needs Node 24+.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  js:
    name: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - name: Shellcheck the install scripts
        run: shellcheck -s sh public/install.sh scripts/homebrew-formula.sh scripts/linux-compat-smoke.sh
      - run: bun run test

  # Builds the Linux release binaries the way release.yml does and runs them in
  # older glibc and Alpine containers, so a broken release build shows up on the
  # pull request and not after merge. Not a deploy gate.
  linux-compat:
    name: linux-compat (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.28
          - target: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: linux-compat-${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.1
      - run: cargo zigbuild --release --locked --target "${{ matrix.zig_target }}"
        working-directory: cli
      - run: scripts/linux-compat-smoke.sh "cli/target/${{ matrix.target }}/release/msn" "${{ matrix.target }}"

  agent-workflows:
    name: real Worker + agent CLI workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: bun install --frozen-lockfile
      - run: bun run test:participants
      - run: bun run test:swarm
      - run: bun run test:critical
      - run: bun run test:dispatch
      - run: bun run test:mcp

  # Releases the Worker from GitHub, never from a personal computer.
  # Pull requests: bundle and validate the Worker with a dry run (no credentials).
  # Push to main: deploy to production, only after every job above passed.
  deploy:
    name: deploy Worker
    needs: [rust, js, agent-workflows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-worker-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      # wrangler needs Node 22 or newer.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Bundle and validate the Worker (dry run)
        run: bunx wrangler deploy --dry-run --outdir dist
      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Worker not deployed::Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set."
            exit 1
          fi
          bunx wrangler deploy --message "GitHub Actions ${GITHUB_SHA::12} (run ${GITHUB_RUN_ID})"
