name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  js:
    name: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  agent-workflows:
    name: real Worker + agent CLI workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: bun install --frozen-lockfile
      - run: bun run test:participants
      - run: bun run test:swarm
      - run: bun run test:critical
      - run: bun run test:dispatch

  # Releases the Worker from GitHub, never from a personal computer.
  # Pull requests: bundle and validate the Worker with a dry run (no credentials).
  # Push to main: deploy to production, only after every job above passed.
  deploy:
    name: deploy Worker
    needs: [rust, js, agent-workflows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-worker-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      # wrangler needs Node 22 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Bundle and validate the Worker (dry run)
        run: bunx wrangler deploy --dry-run --outdir dist
      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Worker not deployed::Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set."
            exit 1
          fi
          bunx wrangler deploy --message "GitHub Actions ${GITHUB_SHA::12} (run ${GITHUB_RUN_ID})"
