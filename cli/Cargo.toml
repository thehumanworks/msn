[package]
name = "msn-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line client for the msn channel messaging service"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "msn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = { version = "0.10", default-features = false }
thiserror = "2.0.20"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.149"

[profile.mutants]
inherits = "test"
debug = "none"
