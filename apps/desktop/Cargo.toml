[package]
name = "msn-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native egui/eframe desktop client for the msn channel messaging service"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "msn_desktop"
path = "src/lib.rs"

[[bin]]
name = "msn-desktop"
path = "src/main.rs"

[dependencies]
msn-cli = { path = "../../cli" }
eframe = { version = "0.36.2", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
thiserror = "2.0.20"

[dev-dependencies]
tiny_http = "0.12.0"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 2
debug = false
